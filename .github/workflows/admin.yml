name: admin-web
on:
  push: { paths: ["apps/admin_web/**", ".github/workflows/admin.yml"] }
  pull_request: { paths: ["apps/admin_web/**"] }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/admin_web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/admin_web/package-lock.json }
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run build
